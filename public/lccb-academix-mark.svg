<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 318 88" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;display=swap');
      .txt-brand {
        font-family: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        paint-order: stroke;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- LCCB stamp -->
  <g transform="rotate(-2 20 12)">
    <text
      x="7" y="18" class="txt-brand"
      font-size="15" letter-spacing="2.5"
      stroke="#0f2942" stroke-width="2.6" fill="#d4ac0d"
      rotate="2 -2 2 -1"
    >LCCB</text>
    <text
      x="7" y="18" class="txt-brand"
      font-size="15" letter-spacing="2.5"
      stroke="#0f2942" stroke-width="0.8" fill="#0f2942"
      rotate="2 -2 2 -1"
    >LCCB</text>
  </g>

  <!-- ACADEMIX — gold offset edge behind, navy sticker letters in front -->
  <g>
    <text
      x="9" y="84" class="txt-brand"
      font-size="62" letter-spacing="-1.5" textLength="302" lengthAdjust="spacing"
      stroke="#0f2942" stroke-width="3.4" fill="#d4ac0d"
      rotate="-3 2 -1 3 -2 2 -1 2"
    >ACADEMIX</text>
    <text
      x="4" y="80" class="txt-brand"
      font-size="62" letter-spacing="-1.5" textLength="302" lengthAdjust="spacing"
      stroke="#0f2942" stroke-width="4.2" fill="#0f2942"
      rotate="-3 2 -1 3 -2 2 -1 2"
    >ACADEMIX</text>
  </g>
</svg>
